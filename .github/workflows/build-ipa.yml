name: Build WDA IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Build for testing (unsigned)
        run: |
          xcodebuild clean build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64
      - name: Pack IPA (excluding XC* frameworks so device-embedded ones are used)
        run: |
          cd build/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -R WebDriverAgentRunner-Runner.app Payload/
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/XC*.framework
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/Testing.framework
          rm -f  Payload/WebDriverAgentRunner-Runner.app/Frameworks/libXCTestSwiftSupport.dylib
          zip -qr WebDriverAgentRunner.ipa Payload
          unzip -l WebDriverAgentRunner.ipa | grep -E "Frameworks/[^/]+$" | head
      - uses: actions/upload-artifact@v4
        with:
          name: wda-ipa
          path: build/Build/Products/Debug-iphoneos/WebDriverAgentRunner.ipa
